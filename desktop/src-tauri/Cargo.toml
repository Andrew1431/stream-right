[package]
name = "stream-desktop"
version = "0.1.0"
edition = "2021"
license = "MIT"

[lib]
name = "stream_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg"] }
base64 = "0.23.1"
# Native Go live sender: sans-IO WebRTC, plus a blocking HTTP client for WHIP.
str0m = { version = "0.25", default-features = false }
ureq = "3"

[target.'cfg(windows)'.dependencies]
# Native Go live sender on Windows CNG crypto (str0m is declared below).
str0m = { version = "0.25", default-features = false, features = ["wincrypto"] }
windows = { version = "0.61", features = [
  "Foundation",
  "Graphics",
  "Graphics_Capture",
  "Graphics_DirectX",
  "Graphics_DirectX_Direct3D11",
  "Security_Authorization_AppCapabilityAccess",
  "Win32_Foundation",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_System_Performance",
  "Win32_System_Threading",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Direct3D11",
  "Win32_System_WinRT_Graphics_Capture",
  "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
# examples/whip_probe.rs: synthetic H.264 and Opus to test the WHIP sender without capture.
openh264 = "0.9"
opus1 = "0.3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

# Thumbnail scaling and JPEG encoding crawl unoptimized; keep dev captures snappy.
[profile.dev.package.image]
opt-level = 3

[profile.dev.package.zune-jpeg]
opt-level = 3

# The probe's software encoder can't hold 30 fps at 720p unoptimized.
[profile.dev.package.openh264-sys2]
opt-level = 3
